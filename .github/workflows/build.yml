name: Build Telescraper

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
        
    - name: Build EXE
      run: |
        pyinstaller --noconfirm --onefile --windowed --name "TelegramForwarder" --clean --add-data "README_CLIENT.txt;." --add-data "DOCUMENTATION.md;." main.py
        
    - name: Upload Windows Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Telescraper-Windows
        path: dist/TelegramForwarder.exe

    - name: Release Windows
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: dist/TelegramForwarder.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install py2app
        
    - name: Build App
      run: |
        # Create setup.py for py2app
        echo "from setuptools import setup" > setup.py
        echo "APP = ['main.py']" >> setup.py
        echo "DATA_FILES = []" >> setup.py
        echo "OPTIONS = {'argv_emulation': True, 'packages': ['telethon', 'PyQt6', 'qasync', 'dotenv']}" >> setup.py
        echo "setup(app=APP, data_files=DATA_FILES, options={'py2app': OPTIONS}, setup_requires=['py2app'])" >> setup.py
        
        python setup.py py2app
        
    - name: Create Zip
      run: |
        cd dist
        zip -r Telescraper-Mac.zip main.app
        
    - name: Upload Mac Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Telescraper-Mac
        path: dist/Telescraper-Mac.zip

    - name: Release Mac
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: dist/Telescraper-Mac.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
