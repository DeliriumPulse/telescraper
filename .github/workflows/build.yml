name: Build Telegram Forwarder

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
        
    - name: Build EXE
      run: |
        pyinstaller --noconfirm --onefile --windowed --name "TelegramForwarder" --clean --add-data "README_CLIENT.txt;." --add-data "DOCUMENTATION.md;." main.py
        
    - name: Upload Windows Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TelegramForwarder-Windows
        path: dist/TelegramForwarder.exe

  build-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
        
    - name: Build App
      run: |
        pyinstaller --noconfirm --onefile --windowed --name "TelegramForwarder" --clean --add-data "README_CLIENT.txt:." --add-data "DOCUMENTATION.md:." main.py
        
    - name: Create DMG (Optional but recommended)
      run: |
        # Simple zip for now as creating a proper DMG is complex without extra tools
        cd dist
        zip -r TelegramForwarder-Mac.zip TelegramForwarder.app
        
    - name: Upload Mac Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TelegramForwarder-Mac
        path: dist/TelegramForwarder-Mac.zip
